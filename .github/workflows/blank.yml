name: Build BlockLaunch

on:
  push:
    tags: ['v*']        # сборка при создании тега, например v1.0.0
  workflow_dispatch:    # или вручную кнопкой во вкладке Actions

permissions:
  contents: write       # нужно, чтобы прикрепить файлы к релизу

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run dist:win
        if: runner.os == 'Windows'

      - run: npm run dist:mac
        if: runner.os == 'macOS'

      # Готовые файлы можно скачать со страницы запуска сборки
      - uses: actions/upload-artifact@v4
        with:
          name: BlockLaunch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg

      # А при сборке по тегу они сразу попадают в Releases
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
